{% extends 'base.html' %}
{% block title %}{{ action }} Quiz – QuizLive{% endblock %}

{% block content %}
<div class="page-header">
    <a href="{% url 'quiz_list' %}" class="btn btn-ghost">← Volver</a>
    <h1>{{ action }} Quiz</h1>
</div>

<div class="card card-md">
    <form method="post" class="form-vertical">
        {% csrf_token %}
        <div class="form-group">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" name="titulo" class="form-control" value="{{ quiz.titulo|default:'' }}" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-control" rows="3">{{ quiz.descripcion|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label for="course">Curso *</label>
            <select id="course" name="course" class="form-control" required>
                {% for c in mis_cursos %}
                <option value="{{ c.pk }}" {% if quiz.course.pk == c.pk %}selected{% endif %}>{{ c.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="tiempo_por_pregunta">Tiempo por pregunta (segundos) *</label>
            <input type="number" id="tiempo_por_pregunta" name="tiempo_por_pregunta" class="form-control"
                   value="{{ quiz.tiempo_por_pregunta|default:30 }}" min="5" max="120" required>
        </div>
        <div class="form-actions">
            <a href="{% url 'quiz_list' %}" class="btn btn-ghost">Cancelar</a>
            <button type="submit" class="btn btn-primary">{{ action }} Quiz</button>
        </div>
    </form>
</div>
{% endblock %}
